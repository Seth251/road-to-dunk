  <style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132e3c;background:#f5f8f7;font-synthesis:none;--navy:#102532;--ink:#17313d;--lime:#b6f36a;--soft:#edf8e2;--border:#dce6e5;--muted:#657780;--panel:#fff;--shadow:0 8px 32px rgba(10,36,44,.045)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.52}
:focus-visible{outline:3px solid #70bc38;outline-offset:3px}
.app-shell{max-width:1120px;margin:auto;padding:0 32px 16px}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 19px}
.brand{display:flex;align-items:center;gap:13px;color:var(--navy)}
.brand-emblem{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:var(--lime)}
.brand-emblem svg{width:25px;height:25px}
.brand-copy{display:flex;flex-direction:column;gap:3px}

  };
  const app = document.getElementById('app');

  function mondayISO(d = new Date()) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    date.setUTCDate(date.getUTCDate() - ((date.getUTCDay() + 6) % 7));
    return date.toISOString().slice(0, 10);
  }
  function freshState() {
    return { version: 1, profile: { name: 'ATHLETE', age: 21, heightCm: 178, weightKg: 61, startDate: mondayISO() },
      selectedWeek: 1, selectedDay: 'mon', sessions: {}, weeklyLogs: {}, milestones: {}, optionalDays: {} };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1 || typeof parsed !== 'object') return freshState();
      const base = freshState();
      return {
        ...base, profile: { ...base.profile, ...(validObject(parsed.profile) ? parsed.profile : {}) },
        selectedWeek: clamp(Number(parsed.selectedWeek) || 1, 1, 12),
        selectedDay: DAYS.some(d => d.id === parsed.selectedDay) ? parsed.selectedDay : 'mon',
        sessions: validObject(parsed.sessions) ? parsed.sessions : {}, weeklyLogs: validObject(parsed.weeklyLogs) ? parsed.weeklyLogs : {},
        milestones: validObject(parsed.milestones) ? parsed.milestones : {}, optionalDays: validObject(parsed.optionalDays) ? parsed.optionalDays : {}
      };
    } catch (error) { return freshState(); }
  }
  function validObject(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
  function clamp(number, min, max) { return Math.min(max, Math.max(min, number)); }
  function esc(value) { return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (error) { toast('Could not save on this device. Export a backup in Settings.'); }
  }
  function toast(message) {
    const node = document.getElementById('toast');
    node.textContent = message;
    node.classList.add('shown');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => node.classList.remove('shown'), 2700);
  }
  function phaseOf(week) { if (week === 4 || week === 8) return 'deload'; if (week === 12) return 'test'; if (week <= 3) return 'foundation'; if (week <= 7) return 'power'; return 'peak'; }
  function template(week, day) { return PROGRAM[phaseOf(week)][day]; }
  function dateFor(week, dayId = 'mon') {
    let startDate = /^\d{4}-\d{2}-\d{2}$/.test(state.profile.startDate) ? state.profile.startDate : mondayISO();
    const parts = startDate.split('-').map(Number);
    const monday = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    if (!Number.isFinite(monday.getTime())) return new Date();
    const offset = ((monday.getUTCDay() + 6) % 7);
    monday.setUTCDate(monday.getUTCDate() - offset + (week - 1) * 7 + Math.max(0, DAYS.findIndex(d => d.id === dayId)));
    return monday;
  }
  function fmtDate(date, opts = { month: 'short', day: 'numeric' }) { return new Intl.DateTimeFormat('en-US', { ...opts, timeZone: 'UTC' }).format(date); }
  function sessionKey(week, day) { return `${week}_${day}`; }
  function sessionFor(week, day, create = false) {
    const key = sessionKey(week, day);
    if (!validObject(state.sessions[key]) && create) state.sessions[key] = { exercises: {}, notes: '', quality: '', pain: '', effort: '' };
    return state.sessions[key] || { exercises: {}, notes: '', quality: '', pain: '', effort: '' };
  }
  function exerciseLog(week, day, exercise, create = false) {
    const session = sessionFor(week, day, create);
    const current = session.exercises && session.exercises[exercise[0]];
    if (!create) return current || { sets: [] };
    if (!validObject(session.exercises)) session.exercises = {};
    if (!validObject(session.exercises[exercise[0]])) session.exercises[exercise[0]] = { sets: [] };
    const log = session.exercises[exercise[0]];
    if (!Array.isArray(log.sets)) log.sets = [];
    while (log.sets.length < exercise[3]) log.sets.push({ done: false, kg: '', reps: '' });
    return log;
  }
  function isExerciseDone(week, day, exercise) {
    const log = exerciseLog(week, day, exercise);
    if (!Array.isArray(log.sets)) return false;
    return log.sets.length >= exercise[3] && log.sets.slice(0, exercise[3]).every(set => set && set.done === true);
  }
  function dayStatus(week, day) {
    if (!TRAINING_DAYS.includes(day)) return { total: 0, done: 0, percentage: 0, completed: !!state.optionalDays[sessionKey(week, day)] };
    const exercises = template(week, day).items;
    const done = exercises.reduce((n, item) => n + Number(isExerciseDone(week, day, item)), 0);
    return { total: exercises.length, done, percentage: Math.round(100 * done / exercises.length), completed: done === exercises.length };
  }
  function weekStatus(week) {
    const completed = TRAINING_DAYS.reduce((n, day) => n + Number(dayStatus(week, day).completed), 0);
    const exerciseDone = TRAINING_DAYS.reduce((n, day) => n + dayStatus(week, day).done, 0);
    const exerciseTotal = TRAINING_DAYS.reduce((n, day) => n + dayStatus(week, day).total, 0);
    return { completed, total: 4, pct: Math.round(100 * exerciseDone / exerciseTotal) };
  }
  function totalComplete() { let count = 0; for (let w=1; w<=12; w++) count += weekStatus(w).completed; return count; }

    const valid = Array.from({ length:12 }, (_, i) => weeklyLog(i+1)[field]).filter(v => v !== '' && v !== undefined && v !== null).map(Number).filter(Number.isFinite);

  }

    }).join('')}</div>`;
  }
  function sectionHead(title, description, action = '') { return `<div class="section-head"><div><h2>${esc(title)}</h2><p class="subtle">${esc(description)}</p></div>${action}</div>`; }

    const todayTemplate = template(week, shownDay);
    return `<section class="hero">
        <div class="hero-arc" aria-hidden="true"></div>
        <div class="hero-text"><div class="eyebrow">WEEK ${String(week).padStart(2,'0')} / 12 &nbsp; • &nbsp; ${esc(phase.label.toUpperCase())}</div>
          <h1>ROAD TO<br>YOUR FIRST<br><span>DUNK.</span></h1>
          <p>Built for a ${esc(state.profile.heightCm)} cm two-foot jumper. Power cleans, hang cleans, plyometrics, isometrics—and a real jump progression.</p>
          <div class="hero-stats"><div class="hero-stat"><strong>${ws.completed}/4</strong><label>Sessions this week</label></div>

            <div class="hero-stat"><strong>${esc(fmtDate(dateFor(week,'mon')))}</strong><label>Week starts</label></div></div></div>
          <div class="hero-ring" aria-label="This week's workout progress ${ws.pct}%"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="48"></circle><circle class="ring-fg" cx="60" cy="60" r="48" stroke-dasharray="${(2*Math.PI*48*ws.pct/100).toFixed(2)} 301.6"></circle></svg><div class="hero-ring-center"><strong>${ws.pct}%</strong><small>WEEK DONE</small></div></div>
      </section>
      <div class="summary-grid">

  function chartMarkup(metric) {
    const label=metric==='rimCm'?'Height above rim (cm)':metric==='verticalIn'?'Approach vertical (in)':metric==='power'?'Power clean (kg)':metric==='hang'?'Hang clean (kg)':'Back squat top set (kg)';
    const baseline = metric==='rimCm'?0:metric==='verticalIn'?30:null;
    const values = Array.from({length:12},(_,i)=>{const raw=weeklyLog(i+1)[metric];return raw===''||raw===null||raw===undefined?null:Number(raw);});
    const points=values.map((v,i)=>Number.isFinite(v)?{week:i+1,val:v}:null).filter(Boolean);
    if (!points.length) return `<div class="chart-empty">No ${esc(label.toLowerCase())} logged yet.<br>Enter a weekly result below to start the chart.</div>`;
    if (baseline!==null) points.unshift({week:0,val:baseline});
    const vals=points.map(p=>p.val), min=Math.min(...vals),max=Math.max(...vals), span=Math.max(2,(max-min));
    const low = Math.floor((min-span*.22)/2)*2,high = Math.ceil((max+span*.22)/2)*2;
    const W=740,H=245,x0=58,x1=715,y0=18,y1=203;
    const x=(w)=>x0+(w/12)*(x1-x0);
    const y=(v)=>y1-(v-low)/(high-low)*(y1-y0);
    const lines=[];
    for (let i=0;i<=4;i++){
      const val=low+(high-low)*i/4, yy=y(val);
      lines.push(`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="#e6eeec" stroke-width="1"/><text x="${x0-12}" y="${(yy+4).toFixed(1)}" text-anchor="end" fill="#7c9095" font-size="11">${Number(val.toFixed(1))}</text>`);
    }
    const segment=[];let current=[];
    // Don't connect over unrecorded weeks; keep discrete observations visible instead.
    for (let i=0;i<=12;i++) {
      const p=points.find(p=>p.week===i);
      if (p) current.push(`${x(p.week).toFixed(1)},${y(p.val).toFixed(1)}`);
    }
    const path=points.map((p,i)=>`${i?'L':'M'} ${x(p.week).toFixed(1)} ${y(p.val).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} graph for weeks 1 through 12">
      ${lines.join('')}<path d="${path}" stroke="#77ae47" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${points.map(p=>`<circle cx="${x(p.week).toFixed(1)}" cy="${y(p.val).toFixed(1)}" r="${p.week===0?'4':'5'}" fill="#7db94c" stroke="#fff" stroke-width="2"><title>${p.week===0?'Baseline':'Week '+p.week}: ${p.val} ${metric==='rimCm'?'cm':metric==='verticalIn'?'in':'kg'}</title></circle>`).join('')}
      ${Array.from({length:13},(_,i)=>`<text x="${x(i).toFixed(1)}" y="226" fill="#82979a" font-size="10" text-anchor="middle">${i===0?'START':i}</text>`).join('')}</svg>`;
  }

        <hr style="border:0;border-top:1px solid #e2eae8;margin:24px 0 18px"><h3>Install on your phone</h3>
        <p><strong>iPhone:</strong> Open the hosted link in Safari → Share → Add to Home Screen.</p>
        <p><strong>Android:</strong> Open the hosted link in Chrome → menu → Install app or Add to Home screen.</p>
        <p class="small subtle">Install and offline support work when the app is hosted over HTTPS. Data does not automatically sync between devices.</p>
        <hr style="border:0;border-top:1px solid #e2eae8;margin:24px 0 18px"><button type="button" class="btn btn-danger" data-action="reset-all">Reset all training data</button>
      </section></div>
      <div class="info-grid" style="margin-top:17px"><article class="panel info-card"><h3>Training principles</h3><ul><li>Warm up 10–15 minutes.</li><li>Jump quality is more important than fatigue.</li><li>Rest 2–3 minutes between demanding lifts and jumps.</li><li>Weeks 4 and 8 are deloads; week 12 is taper and test.</li></ul></article>
      <article class="panel info-card"><h3>Technique and safety</h3><ul><li>Lift loads that you can control technically.</li><li>Use a qualified coach for Olympic-lift technique and secured rack-based isometrics.</li><li>Persistent knee, shin, or Achilles pain calls for less loading and professional assessment.</li><li>Unofficial THP-inspired adaptation—not an official THP program.</li></ul></article></div>`;
  }
  function setTab(tab) { activeTab=tab; expanded.clear(); render(); window.scrollTo({top:0,behavior:'auto'}); }
  function setWeek(week) { state.selectedWeek=clamp(Number(week)||1,1,12); save(); render(); }
  function exerciseById(id) { return template(state.selectedWeek,state.selectedDay)?.items.find(ex => ex[0]===id); }
  function action(event) {
    const nav=event.target.closest('[data-tab]');
    if (nav) { setTab(nav.dataset.tab); return; }
    const button=event.target.closest('[data-action]');
    if (!button) return;
    const which=button.dataset.action, week=state.selectedWeek, day=state.selectedDay;
    if (which==='select-week') return setWeek(Number(button.dataset.week));
    if (which==='previous-week') return setWeek(week-1);
    if (which==='next-week') return setWeek(week+1);
    if (which==='go-workout') return setTab('workout');
    if (which==='select-day' || which==='select-day-go') {
      state.selectedDay=button.dataset.day; save();
      if (which==='select-day-go') return setTab('workout');
      expanded.clear(); render(); return;
    }
    if (which==='expand-ex') {
      const key=sessionKey(week,day)+'_'+button.dataset.ex;
      expanded.has(key)?expanded.delete(key):expanded.add(key); render(); return;
    }
    if (which==='mark-all') {
      template(week,day).items.forEach(ex=>{exerciseLog(week,day,ex,true).sets.slice(0,ex[3]).forEach(s=>s.done=true);});
      save();render();toast('Session marked complete ✓'); return;
    }
    if (which==='clear-day') {
      if (!confirm('Clear the completed set checkboxes for this session? Saved weights and notes will stay.')) return;
      template(week,day).items.forEach(ex=>{exerciseLog(week,day,ex,true).sets.forEach(s=>s.done=false);});
      save();render();toast('Session checkboxes cleared'); return;
    }
    if (which==='quality'||which==='pain') {
      sessionFor(week,day,true)[which]=button.dataset.value; save();render();return;
    }
    if (which==='timer-length') {
      timerSeconds=Number(button.dataset.seconds)||120;timerEndsAt=null;timerPausedLeft=timerSeconds;updateTimerDisplay();return;
    }
    if (which==='timer-toggle') {
      if (timerEndsAt) {timerPausedLeft=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));timerEndsAt=null;}
      else {timerEndsAt=Date.now()+Math.max(1,timerPausedLeft)*1000;}updateTimerDisplay();return;
    }
    if (which==='timer-reset') {timerEndsAt=null;timerPausedLeft=timerSeconds;updateTimerDisplay();return;}
    if (which==='export') {exportData();return;}
    if (which==='reset-all') {
      if (!confirm('Delete ALL saved checkboxes, lifting logs, notes, and milestones on this device? Export a backup first. This cannot be undone.'))return;
      state=freshState();expanded.clear();save();setTab('home');toast('Training data reset');
    }
  }
  function handleChange(event) {
    const input=event.target, kind=input.dataset.kind;
    if (input.id==='chart-metric') {chartMetric=input.value;const chart=document.getElementById('performance-chart');if(chart)chart.innerHTML=chartMarkup(chartMetric);return;}
    if (!kind && input.id==='import-data') {importData(input);return;}
    if (!kind) return;
    const week=state.selectedWeek,day=state.selectedDay;
    if (kind==='exercise-check') {
      const ex=exerciseById(input.dataset.ex);if(!ex)return;
      exerciseLog(week,day,ex,true).sets.slice(0,ex[3]).forEach(set=>set.done=input.checked);
      save();render();return;
    }
    if (kind==='set-check'||kind==='set-weight'||kind==='set-reps') {
      const ex=exerciseById(input.dataset.ex),index=Number(input.dataset.set);
      if (!ex || !Number.isInteger(index) || index<0 || index>=ex[3]) return;
      const set=exerciseLog(week,day,ex,true).sets[index];
      if (kind==='set-check')set.done=input.checked;
      if (kind==='set-weight') set.kg = input.value===''?'':String(clamp(Number(input.value)||0,0,500));
      if (kind==='set-reps') set.reps = input.value.slice(0,20);
      save();if(kind==='set-check')render();return;
    }
    if (kind==='session-field') {
      const field=input.dataset.field;if(!['notes','effort'].includes(field))return;
      sessionFor(week,day,true)[field]=field==='notes'?input.value.slice(0,1500):input.value.slice(0,3);save();return;
    }
    if (kind==='weekly-field') {
      const field=input.dataset.field;
      if (!['power','hang','squatKg','squatReps','verticalIn','rimCm','bodyKg','quality','notes'].includes(field))return;
      if (!validObject(state.weeklyLogs[String(week)]))state.weeklyLogs[String(week)]={};
      let value=input.value;
      if (field==='notes') value=value.slice(0,2000);
      else if (field==='quality') value=['Sharp','OK','Flat'].includes(value)?value:'';
      else if (value!=='') {
        const limits = { power:[0,300],hang:[0,300],squatKg:[0,400],squatReps:[0,30],verticalIn:[0,80],rimCm:[-80,100],bodyKg:[20,250] };
        value=String(clamp(Number(value)||0,...limits[field]));
        input.value=value;
      }
      state.weeklyLogs[String(week)][field]=value;save();
      const chart=document.getElementById('performance-chart');
      if(chart)chart.innerHTML=chartMarkup(chartMetric);
      toast('Weekly log saved');return;
    }
    if (kind==='milestone') {
      state.milestones[input.dataset.id]=input.checked;save();render();toast(input.checked?'Milestone unlocked ✓':'Milestone unchecked');return;
    }
    if (kind==='optional') {state.optionalDays[sessionKey(week,input.dataset.day)]=input.checked;save();render();return;}
    if (kind==='profile-field') {
      const field=input.dataset.field;
      if(!['name','age','heightCm','weightKg','startDate'].includes(field))return;
      if(field==='startDate') {
        const value=input.value;
        if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||!Number.isFinite(Date.parse(value))) {toast('Please enter a valid date');return;}
        const [yr,m,dd] = value.split('-').map(Number);
        if(yr<2020 || yr>2100) {toast('Choose a date from 2020–2100');return;}
        const d=new Date(Date.UTC(yr,m-1,dd));
        if(d.getUTCFullYear()!==yr||d.getUTCMonth()!==m-1||d.getUTCDate()!==dd){toast('Please enter a valid date');return;}
        d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
        state.profile.startDate=d.toISOString().slice(0,10);
      } else if(field==='name')state.profile.name=input.value.slice(0,48);
      else {const ranges={age:[14,100],heightCm:[100,230],weightKg:[20,250]};state.profile[field]=clamp(Number(input.value)||ranges[field][0],...ranges[field]);}
      save();render();toast('Profile saved');
    }
  }
  function exportData() {
    const blob=new Blob([JSON.stringify({ ...state, exportedAt:new Date().toISOString() },null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='road-to-dunk-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Backup downloaded');
  }
  async function importData(input) {
    const file=input.files && input.files[0];if(!file)return;
    if(file.size>3*1024*1024){toast('Backup too large (maximum 3 MB)');input.value='';return;}
    try {
      const parsed=JSON.parse(await file.text());
      if(!parsed || parsed.version!==1 || !validObject(parsed.sessions) || !validObject(parsed.weeklyLogs) || !validObject(parsed.profile))throw new Error('Invalid backup');
      if(!confirm('Import backup and replace all current workout data on this device?'))return;
      state={...freshState(),profile:{...freshState().profile,...parsed.profile},selectedWeek:clamp(Number(parsed.selectedWeek)||1,1,12),
        selectedDay:DAYS.some(d=>d.id===parsed.selectedDay)?parsed.selectedDay:'mon',sessions:parsed.sessions,weeklyLogs:parsed.weeklyLogs,
        milestones:validObject(parsed.milestones)?parsed.milestones:{},optionalDays:validObject(parsed.optionalDays)?parsed.optionalDays:{}};
      state.profile.name=String(state.profile.name??'ATHLETE').slice(0,48);
      save();setTab('home');toast('Backup restored ✓');
    } catch(error) {toast('This is not a valid Road to Dunk backup');}finally {input.value='';}
  }
  function updateTimerDisplay() {
    if(timerEndsAt && Date.now()>=timerEndsAt) {timerEndsAt=null;timerPausedLeft=0;toast('Rest timer finished — ready when you are');}
    const left=timerEndsAt?Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000)):timerPausedLeft;
    const node=document.getElementById('rest-clock');
    if(node)node.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
    const toggle=document.getElementById('timer-toggle');if(toggle)toggle.textContent=timerEndsAt?'Pause':left===0?'Restart':'Start';
  }
  app.addEventListener('click',action);
  app.addEventListener('change',handleChange);
  // Save notes while typing without rebuilding or stealing input focus.
  app.addEventListener('input', event=>{
    const input=event.target;
    if(input.dataset.kind==='session-field' && input.dataset.field==='notes') {
      sessionFor(state.selectedWeek,state.selectedDay,true).notes=input.value.slice(0,1500);save();
    }
    if(input.dataset.kind==='weekly-field' && input.dataset.field==='notes') {
      const key=String(state.selectedWeek);
      if(!validObject(state.weeklyLogs[key]))state.weeklyLogs[key]={};
      state.weeklyLogs[key].notes=input.value.slice(0,2000);save();
    }
  });
  setInterval(updateTimerDisplay,1000);
  render();
  if('serviceWorker' in navigator && location.protocol==='https:') {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();

</script>
